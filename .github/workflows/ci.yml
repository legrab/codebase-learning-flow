name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  structural:
    name: Structural validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Validate repository structure
        run: python scripts/ci-validate.py
      - name: Validate POSIX installer syntax
        run: sh -n scripts/install.sh scripts/register-vault.sh
      - name: Run installer smoke test
        run: bash scripts/ci-install-test.sh

  powershell:
    name: PowerShell installer smoke test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $errors = @()
          foreach ($path in @(
            "scripts/install.ps1",
            "scripts/register-vault.ps1",
            "scripts/ci-vault-test.ps1"
          )) {
            $fileErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path), [ref]$null, [ref]$fileErrors)
            $errors += $fileErrors
          }
          if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }
      - name: Run installer smoke test
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "learning-flow-ci"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          & "$PWD/scripts/install.ps1" `
            -Target $root `
            -Repository $env:GITHUB_REPOSITORY `
            -Ref $env:GITHUB_SHA `
            -Profile minimal `
            -Mode fail `
            -SkipRootAgents
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "$root/learning-flow")) {
            throw "Installer did not create the learning-flow component."
          }
      - name: Run global and linked scope smoke test
        shell: pwsh
        run: |
          $globalRoot = Join-Path $env:RUNNER_TEMP "learning-flow-global"
          $linked = Join-Path $env:RUNNER_TEMP "learning-flow-linked"
          New-Item -ItemType Directory -Force -Path $globalRoot, $linked | Out-Null
          $env:CODEBASE_LEARNING_FLOW_HOME = $globalRoot
          & "$PWD/scripts/install.ps1" `
            -Scope Global `
            -Repository $env:GITHUB_REPOSITORY `
            -Ref $env:GITHUB_SHA `
            -Profile full `
            -Mode fail
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$PWD/scripts/install.ps1" `
            -Target $linked `
            -Scope Linked `
            -Repository $env:GITHUB_REPOSITORY `
            -Ref $env:GITHUB_SHA `
            -Mode fail `
            -SkipRootAgents
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "$globalRoot/skills/repository-learning/SKILL.md")) {
            throw "Global scope did not install managed skills."
          }
          if (Test-Path "$globalRoot/learning-flow/MAP.md") {
            throw "Repository-authored MAP.md reached the global root."
          }
          if (-not (Test-Path "$linked/learning-flow/MAP.md")) {
            throw "Linked scope did not install repository learning state."
          }
          if (Test-Path "$linked/agentic-flow/AGENTS.md") {
            throw "Framework instructions were duplicated into the linked repository."
          }
      - name: Run LearningVault lifecycle test
        shell: pwsh
        run: ./scripts/ci-vault-test.ps1
